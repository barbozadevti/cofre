name: CI

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Testes e empacotamento
        run: mvn -B verify
      - name: Teste de fumaça do jar
        run: |
          java -jar target/cofre.jar --spring.datasource.url=jdbc:h2:mem:fumaca &
          for i in $(seq 1 60); do curl -sf http://localhost:5230/health && break; sleep 1; done
          curl -sf http://localhost:5230/api/contas | grep -q "Mario Andrade"
          curl -sf http://localhost:5230/ | grep -q "<title>Cofre</title>"
          printf '6\n0\n' | java -jar target/cofre.jar --terminal --spring.datasource.url=jdbc:h2:mem:fumaca-terminal | grep -q "Helena Prado"
