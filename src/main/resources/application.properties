spring.application.name=cofre
server.port=5230

# H2 em arquivo na pasta do usuário (~/.cofre), igual para qualquer pasta de onde o Cofre for iniciado.
# AUTO_SERVER permite site e terminal abertos ao mesmo tempo.
spring.datasource.url=jdbc:h2:file:~/.cofre/cofre;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health
management.endpoints.web.base-path=/
management.endpoints.web.path-mapping.health=health

# Contas de exemplo na primeira execução.
cofre.demo=true
# O atalho liga para abrir o navegador sozinho.
cofre.abrir-navegador=false
