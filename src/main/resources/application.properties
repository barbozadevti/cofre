spring.application.name=cofre
server.port=${PORT:5230}

# H2 em arquivo na pasta do usuário (~/.cofre), igual para qualquer pasta de onde o Cofre for iniciado.
# AUTO_SERVER permite site e terminal abertos ao mesmo tempo. Para PostgreSQL, use o perfil "postgres".
spring.datasource.url=jdbc:h2:file:~/.cofre/banco;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=

# O esquema vem das migrações do Flyway; o Hibernate só confere se as entidades batem com ele.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration

# Sessão: cookie HttpOnly, SameSite=Lax e expiração em 20 minutos parado, como nos bancos.
server.servlet.session.timeout=20m
server.servlet.session.cookie.name=COFRE_SESSAO
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

management.endpoints.web.exposure.include=health
management.endpoints.web.base-path=/
management.endpoints.web.path-mapping.health=health

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.api-docs.path=/v3/api-docs

# Clientes, funcionários e movimentação de exemplo na primeira execução.
cofre.demo=true
# O atalho liga para abrir o navegador sozinho.
cofre.abrir-navegador=false
# Cobrança diária dos juros do cheque especial (00:05).
cofre.juros.agendado=true
# Segredo do CVV dinâmico. Em produção, defina a variável de ambiente COFRE_CARTAO_SEGREDO.
cofre.cartao.segredo=${COFRE_CARTAO_SEGREDO:segredo-de-desenvolvimento-troque-em-producao}
